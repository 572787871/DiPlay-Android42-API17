plugins {
    id 'com.android.library'
}
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 17
        targetSdk = 37
        multiDexEnabled true

        ndk {
            // The target CS55 head unit is a 32-bit ARM Android 4.2 device.
            // Building only this ABI also keeps the legacy package small and
            // prevents an API-17 build from depending on unavailable host ABIs.
            abiFilters 'armeabi-v7a'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-17'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // r25 intentionally rejects targets below API 19.  The CS55 head unit is
    // Android 4.2.2/API 17, so use r23: it is the newest installed NDK that
    // still emits genuinely API-17-loadable armeabi-v7a libraries.
    ndkVersion = '23.1.7779620'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
}
dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation libs.bouncycastle
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}
